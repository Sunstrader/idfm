name: Actualiser les données IDFM

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Actualiser le GTFS TAD
        run: python tools/update_tad_data.py --out-dir data
      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tad_data.json data/tad_stops.csv data/tad_stops.geojson data/tad_stops.kml
          git diff --cached --quiet || git commit -m "Actualiser les données TAD IDFM"
          git push
