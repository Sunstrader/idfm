name: Publier la carte TAD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Charger les données IDFM
        run: python tools/update_tad_data.py --out-dir data
      - name: Importer les repères historiques My Maps
        run: |
          curl --fail --location --retry 2 "https://www.google.com/maps/d/kml?mid=1v1voPh8VvLOb_C6ASitZSuDcVBJLAal3&forcekml=1" --output /tmp/tad-idfm-mymaps.kml
          python import_mymaps.py /tmp/tad-idfm-mymaps.kml --merge data/tad_data.json

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
